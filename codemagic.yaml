workflows:
  ios-build:
    name: iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - apple_auth
      vars:
        XCODE_PROJECT: "build/iPSX2.xcodeproj"
        XCODE_SCHEME: "iPSX2"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: | 
          brew install cmake
      - name: Generate Xcode Project
        script: | 
          mkdir -p build
          cmake -G Xcode -B build
      - name: Build IPA
        script: | 
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com

